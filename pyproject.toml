[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dcl-form-assignment-poc"
version = "0.1.0"
description = "Assign compliance forms to DataHub tables when a tag is added"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["acryl-datahub-actions==1.6.0.16"]

[project.optional-dependencies]
dev = ["build>=1.2", "ruff>=0.9"]

[project.scripts]
dcl-tag-form-demo = "dcl_form_assignment.demo:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["dcl_form_assignment*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
