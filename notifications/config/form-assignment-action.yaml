name: "dcl-compliance-form-assignment-email"
source:
  type: "kafka"
  config:
    connection:
      bootstrap: ${KAFKA_BOOTSTRAP_SERVER:-127.0.0.1:9092}
      schema_registry_url: ${SCHEMA_REGISTRY_URL:-http://127.0.0.1:18080/schema-registry/api/}
    topic_routes:
      mcl: ${METADATA_CHANGE_LOG_VERSIONED_TOPIC_NAME:-MetadataChangeLog_Versioned_v1}
      pe: ${PLATFORM_EVENT_TOPIC_NAME:-PlatformEvent_v1}
filter:
  event_type: "MetadataChangeLogEvent_v1"
  event:
    changeType: "UPSERT"
    aspectName: "forms"
action:
  type: "dcl_notifications.datahub_action:ComplianceFormAssignmentAction"
  config:
    forms:
      - urn: ${DCL_COMPLIANCE_FORM_URN:-urn:li:form:dcl.tour.native.privacy-attestation.v1}
        review_date: ${DCL_COMPLIANCE_FORM_REVIEW_DATE:-2026-09-17}
    business_contact_ownership_type_urn: ${DCL_BUSINESS_CONTACT_OWNERSHIP_TYPE_URN}
    principal_emails:
      "urn:li:corpuser:dcl.maker": ${DCL_DEMO_BCP_MAKER_EMAIL}
      "urn:li:corpuser:datahub": ${DCL_DEMO_BCP_DATAHUB_EMAIL}
    dsg_emails:
      - ${DCL_DEMO_DSG_EMAIL:-dsg@example.test}
    sender: ${DCL_NOTIFICATION_SENDER:-compliance@example.test}
    outbox_directory: ${DCL_NOTIFICATION_OUTBOX:-/tmp/dcl-action-emails}
    review_schedule_path: ${DCL_REVIEW_SCHEDULE_PATH:-/tmp/dcl-review-schedule.json}
    review_poll_seconds: ${DCL_REVIEW_POLL_SECONDS:-60}
datahub:
  server: ${DATAHUB_GMS_URL:-http://127.0.0.1:18080}
  extra_headers:
    Authorization: ${DATAHUB_GMS_AUTHORIZATION}
