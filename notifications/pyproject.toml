[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dcl-notification-poc"
version = "0.1.0"
description = "POC notifications for native DataHub compliance forms"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
actions = ["acryl-datahub-actions==1.5.0.6"]

[project.scripts]
dcl-notification-demo = "dcl_notifications.demo:main"

[tool.setuptools.packages.find]
where = ["src"]
